<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Growth economy · Operations</title><style>body{font:17px/1.6 system-ui;background:#183435;color:#fff3cf;max-width:850px;margin:40px auto;padding:24px}input{font:inherit;width:100px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #65837a}strong{color:#ffe17a}a{color:#c6ec9e}</style><h1>캐릭터 성장 · 경제 점검</h1><p>게임과 같은 성장 규칙을 읽는 운영용 계산기입니다. 값 변경은 시뮬레이션이며 실제 보상이나 잔액을 수정하지 않습니다.</p><label>첫 클리어 챕터 수 <input id="chapters" type="number" min="0" max="10000" value="20"></label><p id="budget"></p><table><thead><tr><th>항목</th><th>상한</th><th>총 비용</th></tr></thead><tbody id="rows"></tbody></table><p>새 챕터 첫 클리어만 1,000잼 · 재방문 0잼. 이벤트·결제 수급은 아직 연결하지 않았습니다. 기존 구매와 보유 잼은 보존됩니다.</p><a href="/?screen=upgrades&demo=menus">업그레이드 데모</a><script type="module">import{progression as c}from'./plant-progression.js';const micro=c.prices.reduce((s,n)=>s+n*10,0),ability=c.abilityPrices.reduce((s,n)=>s+n,0),total=micro*3+ability;document.querySelector('#rows').innerHTML=[['피해','30 / +6%',micro],['발사 간격','30 / −3%',micro],['사거리','30 / +6%',micro],['고유 능력','3 / +12%',ability],['캐릭터 전체','93회',total]].map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('');const input=document.querySelector('#chapters');function render(){const n=Math.max(0,Math.floor(Number(input.value)||0)),g=n*c.firstClearGems;document.querySelector('#budget').textContent=`총 ${g.toLocaleString()}잼 → ${Math.floor(g/total)}명 완성 + ${g%total}잼 잔여`;};input.oninput=render;render();</script></html>
