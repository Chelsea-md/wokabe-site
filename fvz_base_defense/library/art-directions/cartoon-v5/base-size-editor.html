<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기지 크기 조절</title><link rel="stylesheet" href="base-size-editor.css"></head><body><main><header><div><a href="./?screen=home">← 게임 프리뷰</a><h1>기지 크기 조절</h1><p>각 단계의 크기를 조절하면 아래 비교와 실제 화면에 바로 반영됩니다. 그림자는 기지 바닥에 붙어서 함께 조절됩니다.</p></div><div class="actions"><button id="smaller">전체 −5%</button><button id="larger">전체 +5%</button><button id="defaults">기본값 복원</button></div></header><section class="live"><iframe id="game" title="크기가 반영되는 실제 게임 화면" src="./?screen=home&amp;editor=base-size"></iframe></section><section id="tiers" aria-label="기지 단계별 크기"></section><section class="share"><div><h2>조절한 값 전달하기</h2><p><b>설정 복사</b>를 누르고 채팅에 붙여넣거나, <b>파일 저장</b>으로 받은 파일을 첨부해주세요. 수정값은 이 브라우저에 자동 저장됩니다.</p></div><div class="actions"><button id="copy">설정 복사</button><button id="download">파일 저장</button><label class="button">설정 불러오기<input id="import" type="file" accept="application/json,.json" hidden></label></div><textarea id="export" readonly aria-label="전달할 기지 크기 설정"></textarea><p id="status" role="status" aria-live="polite">슬라이더를 움직여보세요.</p></section></main><script type="module" src="base-size-editor.js"></script></body></html>
